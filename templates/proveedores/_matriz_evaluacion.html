<table class="tabla"><thead><tr><th>Número</th><th>Grupo</th><th>Requisito</th><th>Peso</th></tr></thead><tbody>{% for peso in pesos %}<tr><td>{{ peso.requisito.numero }}</td><td>{{ peso.requisito.get_grupo_display }}</td><td>{{ peso.requisito.texto }}</td><td>{{ peso.valor }}</td></tr>{% empty %}<tr><td colspan="4">No hay pesos para esta selección.</td></tr>{% endfor %}</tbody></table>
