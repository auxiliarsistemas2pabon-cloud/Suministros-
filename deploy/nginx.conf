# Sustituya dominio y certificados antes de instalar. Nunca publique archivos privados.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name suministros.ejemplo.test;
    return 301 https://suministros.ejemplo.test$request_uri;
}
server {
    listen 443 ssl;
    server_name suministros.ejemplo.test;
    ssl_certificate /etc/ssl/suministros/fullchain.pem;
    ssl_certificate_key /etc/ssl/suministros/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    if ($host != suministros.ejemplo.test) { return 444; }
    location /static/ {
        alias /srv/suministros/static/;
        access_log off;
        expires 7d;
    }
    location /archivos_privados/ { return 404; }
    location /privados/ { return 404; }
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
